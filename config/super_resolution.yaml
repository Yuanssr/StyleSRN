PARSeq:
  full_ckpt: "/root/ysr/model_pth/parseq-bb5792a6.pt"
  img_size: [32,128]
  patch_size: [4,8]
  embed_dim: 384
  enc_depth: 12
  enc_num_heads: 6
  enc_mlp_ratio: 4

  self.max_label_length: 25
  self.decode_ar: True
  self.refine_iters: 1

  dec_num_heads: 12
  dec_mlp_ratio: 4
  dropout: 0.1
  dec_depth: 1
  perm_num: 6
  perm_mirrored: True
  max_label_length: 25


ABINet:
  dataset_max_length: 25
